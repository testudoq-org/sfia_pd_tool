<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFIA - Position Description Generator</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6DQD1KQkQ1Q1hZl1rZl1rZl1rZl1rZl1rZl1rZl1rZl1r"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />

    <link rel="stylesheet" href="./csv2json.css" />
    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css" rel="stylesheet" />
    <!-- Font Awesome 6 for modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div class="container my-4">
      <div class="text-center mb-4 border-bottom pb-3">
        <h1 class="text-primary">SFIA Position Description Generator</h1>
        <p class="lead">Convert SFIA skill data to structured JSON format</p>
      </div>

      <div class="row g-3">
        <div class="col-12 col-md-5">
          <div class="d-flex flex-wrap flex-md-column gap-2 mb-2">
            <button
              type="button"
              class="btn btn-primary w-100 rounded-pill shadow-sm d-flex align-items-center justify-content-center gap-2"
              onclick="sfiaProcessor.processData()"
              aria-label="Process Data"
            >
              <i class="fas fa-play" aria-hidden="true"></i>
              <span>Process Data</span>
            </button>
            <button
              type="button"
              class="btn btn-secondary w-100 rounded-pill shadow-sm d-flex align-items-center justify-content-center gap-2"
              onclick="sfiaProcessor.clearOutput()"
              aria-label="Clear Output"
            >
              <i class="fas fa-trash" aria-hidden="true"></i>
              <span>Clear Output</span>
            </button>
            <button
              type="button"
              class="btn btn-info w-100 rounded-pill shadow-sm d-flex align-items-center justify-content-center gap-2"
              onclick="sfiaProcessor.downloadJson()"
              aria-label="Download JSON"
            >
              <i class="fas fa-download" aria-hidden="true"></i>
              <span>Download JSON</span>
            </button>
            <button
              type="button"
              class="btn btn-outline-primary w-100 rounded-pill shadow-sm d-flex align-items-center justify-content-center gap-2"
              onclick="sfiaProcessor.toggleFormat()"
              aria-label="Toggle Format"
            >
              <i class="fas fa-code" aria-hidden="true"></i>
              <span>Toggle Format</span>
            </button>
            <button
              type="button"
              class="btn btn-outline-secondary w-100 rounded-pill shadow-sm d-flex align-items-center justify-content-center gap-2"
              onclick="sfiaProcessor.showStats()"
              aria-label="Show Statistics"
            >
              <i class="fas fa-chart-bar" aria-hidden="true"></i>
              <span>Show Statistics</span>
            </button>
          </div>
          <div id="status"></div>
          <div id="stats" class="stats" style="display: none"></div>
        </div>
        <div class="col-12 col-md-7">
          <div class="d-flex justify-content-end mb-2">
            <button
              type="button"
              class="btn btn-outline-secondary btn-sm rounded-pill shadow-sm d-flex align-items-center gap-2"
              id="copyOutputBtn"
              aria-label="Copy JSON output to clipboard"
            >
              <i class="fas fa-copy" aria-hidden="true"></i>
              <span>Copy Output</span>
            </button>
          </div>
          <pre id="output"
               class="loading"
               aria-live="polite"
               tabindex="0"
               role="region"
               aria-label="JSON output area"
               style="margin-bottom:0;">
            <code class="language-json">Click "Process Data" to convert SFIA data to JSON</code>
          </pre>
        </div>
      </div>
    </div>
    <script type="module" src="./csv2json.mjs"></script>
    <!-- Prism.js for syntax highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
    <script>
      // Copy Output Button Handler
      document.addEventListener('DOMContentLoaded', function () {
        const btn = document.getElementById('copyOutputBtn');
        const output = document.getElementById('output');
        if (btn && output) {
          btn.addEventListener('click', function () {
            // Copy only the code content
            const code = output.querySelector('code');
            const text = code ? code.textContent : output.textContent;
            if (navigator.clipboard) {
              navigator.clipboard.writeText(text).then(() => {
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = 'Copy Output'; }, 1500);
              });
            } else {
              // fallback for older browsers
              const textarea = document.createElement('textarea');
              textarea.value = text;
              document.body.appendChild(textarea);
              textarea.select();
              document.execCommand('copy');
              document.body.removeChild(textarea);
              btn.textContent = 'Copied!';
              setTimeout(() => { btn.textContent = 'Copy Output'; }, 1500);
            }
          });
        }
      });
    </script>
  </body>
</html>
