<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFIA - Position Description Generator</title>

    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
      integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css"
      integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />

    <link rel="stylesheet" href="./csv2json.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>SFIA Position Description Generator</h1>
        <p class="lead">Convert SFIA skill data to structured JSON format</p>
      </div>

      <div class="controls">
        <div class="btn-group" role="group">
          <button
            type="button"
            class="btn btn-primary"
            onclick="sfiaProcessor.processData()"
          >
            Process Data
          </button>
          <button
            type="button"
            class="btn btn-secondary"
            onclick="sfiaProcessor.clearOutput()"
          >
            Clear Output
          </button>
          <button
            type="button"
            class="btn btn-info"
            onclick="sfiaProcessor.downloadJson()"
          >
            Download JSON
          </button>
        </div>

        <div class="btn-group" role="group">
          <button
            type="button"
            class="btn btn-outline-primary"
            onclick="sfiaProcessor.toggleFormat()"
          >
            Toggle Format
          </button>
          <button
            type="button"
            class="btn btn-outline-secondary"
            onclick="sfiaProcessor.showStats()"
          >
            Show Statistics
          </button>
        </div>
      </div>

      <div id="status"></div>
      <div id="stats" class="stats" style="display: none"></div>
      <div id="output" class="loading">
        Click "Process Data" to convert SFIA data to JSON
      </div>
    </div>
    <script type="module" src="./csv2json.mjs"></script>
  </body>
</html>
